[project]
name = "ga-feishu-streaming-card"
version = "0.1.0"
description = "GA (GenericAgent) to Feishu streaming card bridge engine (independent implementation)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE*", "ATTRIBUTION*"]
authors = [
    { name = "GenericAgent Hive" },
]
# urls 已移除：交付无独立托管仓库（安装走 dist/ 制品或源码目录）
keywords = ["genericagent", "feishu", "lark", "streaming-card", "bridge"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx",
    "pyyaml",
    # Python < 3.11 无标准库 tomllib（metadata 测试解析 pyproject 用）；tomli 2.x API 兼容
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
hfc = "ga_feishu_streaming_card.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ga_feishu_streaming_card"]

[tool.hatch.build.targets.wheel.force-include]
"bridge/hfc_bridge.py" = "ga_feishu_streaming_card/_bridge/hfc_bridge.py"
"ATTRIBUTION.md" = "./ATTRIBUTION.md"
"README.md" = "./README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
